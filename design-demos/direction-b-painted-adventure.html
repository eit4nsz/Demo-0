<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dirección B · Aeródromo pintado</title>
  <!-- Supuesto: la interfaz desaparece dentro de un escenario ilustrado. La forma nace de una pista que también es mapa, menú y lectura de dificultad. -->
  <style>
    :root{--ink:#13233a;--sky1:#18315f;--sky2:#6c67a3;--coral:#e6795f;--sun:#f7d36e;--leaf:#4b9c75;--mint:#a7dfc1;--cream:#fff3c8;--wood:#71452d;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1630;color:var(--cream);font-family:"Trebuchet MS",system-ui,sans-serif}button{font:inherit}
    .scene{position:relative;width:100vw;height:100vh;min-height:650px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,var(--sky1),#40558a 46%,#d97e6d 74%,#dba86b)}
    .scene:after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(13deg,rgba(255,255,255,.022) 0 2px,transparent 2px 7px),radial-gradient(ellipse at 50% 44%,transparent 48%,rgba(9,18,40,.48));mix-blend-mode:overlay}
    .moon{position:absolute;right:12%;top:6%;width:120px;height:120px;border:5px solid #2a3559;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fffde0,#f2d279 58%,#c48357);box-shadow:0 0 0 8px rgba(253,216,120,.1),0 0 54px rgba(253,216,120,.4)}
    .cloud{position:absolute;width:230px;height:55px;border:4px solid #243052;border-radius:50%;background:#b9c8de;opacity:.75;box-shadow:55px -20px 0 -3px #c9d5e6,-55px 4px 0 -8px #a5bad3}.c1{top:17%;left:9%;transform:scale(.7)}.c2{top:23%;right:25%;transform:scale(.45);opacity:.45}
    .hills{position:absolute;inset:auto -5% 0;height:48%;background:#2f7a66;clip-path:polygon(0 58%,10% 33%,20% 55%,31% 20%,45% 51%,57% 28%,68% 59%,79% 30%,91% 48%,100% 25%,100% 100%,0 100%);border-top:8px solid #173b42;filter:drop-shadow(0 -10px #4c9b72)}
    .runway{position:absolute;z-index:2;left:35%;bottom:-10%;width:52%;height:77%;background:linear-gradient(90deg,#51545b,#76736b 48%,#4b4f56);clip-path:polygon(45% 0,58% 0,100% 100%,0 100%);filter:drop-shadow(0 0 0 #16243b)}
    .runway:before{content:"";position:absolute;left:49%;top:8%;width:3%;height:89%;background:repeating-linear-gradient(#fff3be 0 20px,transparent 20px 54px);transform:perspective(280px) rotateX(18deg)}
    .runway:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,224,140,.18) 50%,transparent 60%),repeating-linear-gradient(165deg,transparent 0 37px,rgba(20,27,37,.18) 38px 41px)}
    .tower{position:absolute;z-index:3;right:5%;bottom:24%;width:145px;height:300px;background:#36546c;border:6px solid var(--ink);clip-path:polygon(17% 0,83% 0,100% 13%,82% 21%,78% 100%,22% 100%,18% 21%,0 13%);box-shadow:inset -18px 0 rgba(0,0,0,.18)}
    .tower:before{content:"";position:absolute;inset:17px 12px auto;height:48px;border:5px solid var(--ink);background:repeating-linear-gradient(90deg,#f7d36e 0 20px,#18365b 20px 27px);box-shadow:0 0 22px rgba(247,211,110,.5)}
    .logo{position:absolute;z-index:5;top:4%;left:5%;margin:0;max-width:570px;color:var(--cream);transform:rotate(-2deg);text-transform:uppercase;text-shadow:0 4px 0 #713c2c,0 8px 0 var(--ink),0 14px 22px rgba(0,0,0,.45)}
    .logo span{display:block;color:var(--sun);font:900 15px/1 system-ui;letter-spacing:.38em}.logo strong{display:block;font:900 clamp(48px,6vw,88px)/.85 Georgia,serif;letter-spacing:-.06em;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}.logo em{position:absolute;top:112px;left:7px;display:block;margin:0;padding:5px 9px;border:2px solid var(--ink);border-radius:5px;color:#d7f2de;background:rgba(13,31,61,.88);font:900 10px/1 system-ui;letter-spacing:.14em;font-style:normal;white-space:nowrap;text-shadow:none}
    .portrait{position:absolute;z-index:4;left:4%;top:27%;width:28%;height:50%;overflow:hidden;border:8px solid var(--ink);border-radius:52% 48% 42% 58%/36% 42% 58% 64%;background:#19355a;box-shadow:12px 15px 0 #71452d,18px 22px 0 rgba(9,16,31,.5);transform:rotate(-2deg)}.portrait img{width:100%;height:100%;object-fit:cover;object-position:87% 48%;filter:saturate(1.2) contrast(1.06)}
    .menu{position:absolute;z-index:8;left:37%;top:22%;width:36%;display:grid;gap:12px;transform:rotate(-1deg)}
    .menu button{position:relative;min-height:67px;padding:10px 30px 10px 74px;border:5px solid var(--ink);border-radius:51% 12px 19px 47%/16px 44% 42% 16px;color:var(--cream);background:linear-gradient(165deg,#94613b,#5d3828);box-shadow:0 8px 0 #2b221f,inset 0 5px rgba(255,255,255,.12);cursor:pointer;text-align:left;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 3px var(--ink);transition:transform 170ms var(--ease),filter 170ms ease}
    .menu button:before{content:"✦";position:absolute;left:20px;top:50%;translate:0 -50%;display:grid;place-items:center;width:38px;height:38px;border:4px solid var(--ink);border-radius:50%;background:var(--sun);color:var(--ink);text-shadow:none}.menu button:nth-child(2){transform:translateX(22px);background:linear-gradient(165deg,#347e70,#285764)}.menu button:nth-child(3){transform:translateX(8px);background:linear-gradient(165deg,#4f78a7,#324d78)}.menu button:nth-child(4){transform:translateX(34px);background:linear-gradient(165deg,#8a554e,#604044)}
    .menu .start{min-height:102px;padding-left:91px;background:linear-gradient(165deg,#ee9b44,#d95d45)}.menu .start:before{content:"▶";width:54px;height:54px;background:#fff0a7}.menu b{display:block;font-size:clamp(18px,2vw,29px)}.menu small{font:900 10px/1.4 system-ui;letter-spacing:.22em;color:#d8f1db}.menu button:hover,.menu button:focus-visible{outline:none;filter:brightness(1.14) saturate(1.12);transform:translate(7px,-3px) rotate(1deg)}.menu button:active{transform:translate(6px,5px) scale(.98);box-shadow:0 2px 0 #2b221f}
    .difficulty{position:absolute;z-index:7;left:5%;bottom:4%;width:69%;height:14%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px;border:5px solid var(--ink);border-radius:18px 33px 15px 28px;background:#fff0be;color:var(--ink);box-shadow:8px 9px 0 rgba(24,22,31,.55);transform:rotate(.4deg)}
    .phase{position:relative;display:flex;align-items:end;padding:10px;border:3px solid var(--ink);border-radius:11px 22px 9px 17px;background:#8bd0a4;font:900 12px/1.1 system-ui;text-transform:uppercase}.phase:before{content:"";position:absolute;left:12px;right:12px;top:16px;height:7px;border:2px solid var(--ink);border-radius:8px;background:var(--mint)}.phase:nth-child(2){background:#efd768}.phase:nth-child(3){background:#eb9158}.phase:nth-child(4){background:#d76555}.phase:nth-child(2):before{width:48%}.phase:nth-child(3):before{width:68%}.phase:nth-child(4):before{width:82%}.tag{position:absolute;right:4%;bottom:5%;z-index:9;padding:10px 14px;border:4px solid var(--ink);background:#f7d36e;color:var(--ink);font:900 11px/1 system-ui;transform:rotate(-2deg)}
    @media(max-width:760px){.scene{min-height:0}.logo{top:3%;left:4%}.logo strong{font-size:48px}.logo em{display:none}.portrait{top:19%;left:5%;width:42%;height:35%}.menu{left:9%;top:auto;bottom:3%;width:82%;gap:6px}.menu button,.menu .start,.menu button:nth-child(n){min-height:48px;padding:7px 15px 7px 58px;transform:none}.menu .start{min-height:64px}.menu b{font-size:17px}.difficulty,.tag{display:none}.tower{transform:scale(.62);transform-origin:bottom right}}
  </style>
</head>
<body>
  <main class="scene">
    <div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hills"></div><div class="runway"></div><div class="tower"></div>
    <h1 class="logo"><span>Escuela de</span><strong>Aviación</strong><em>Una aventura nocturna alrededor del mundo</em></h1>
    <figure class="portrait"><img src="../assets/images/menu-hangar-game-art.png" alt="Piloto y gata de Escuela de Aviación"></figure>
    <nav class="menu">
      <button class="start"><b>Comenzar vuelo</b><small>La pista está lista</small></button>
      <button><b>Cómo jugar</b><small>Aprende a volar</small></button>
      <button><b>Ajustes</b><small>Prepara la cabina</small></button>
      <button><b>Créditos</b><small>Tripulación</small></button>
    </nav>
    <section class="difficulty" aria-label="Curva conceptual de dificultad"><div class="phase">Despegue</div><div class="phase">Ruta</div><div class="phase">Gran altura</div><div class="phase">Aproximación</div></section>
    <div class="tag">Dirección B · Aeródromo pintado</div>
  </main>
</body>
</html>
