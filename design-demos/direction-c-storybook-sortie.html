<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dirección C · Bitácora de aventura</title>
  <!-- Supuesto: cada partida es un capítulo de una bitácora mecánica. La forma nace de mapas de ruta, sellos de misión y objetos con personalidad. -->
  <style>
    :root{--ink:#17203b;--night:#10183b;--violet:#34326a;--paper:#f5dfa5;--orange:#e36e3d;--gold:#f2bd4d;--cyan:#52c8bd;--green:#699f62;--red:#c94d4d;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e23;color:var(--paper);font-family:Georgia,"Trebuchet MS",system-ui,sans-serif}button{font:inherit}
    .book{position:relative;width:100vw;height:100vh;min-height:650px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 54% 42%,#4b477d 0 10%,transparent 43%),linear-gradient(155deg,#111939,#1d2852 56%,#452e44)}
    .book:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 68% 14%,#f5dfa5 0 4%,transparent 4.4%),radial-gradient(circle at 14% 32%,rgba(82,200,189,.28),transparent 24%),repeating-linear-gradient(110deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px)}
    .stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff1b3 0 1.5px,transparent 2px);background-size:79px 63px;opacity:.45;transform:rotate(8deg)}
    .map{position:absolute;z-index:2;left:28%;top:12%;width:60%;height:76%;border:8px solid var(--ink);border-radius:44% 56% 49% 51%/48% 40% 60% 52%;background:linear-gradient(165deg,#f5dfa5,#dca866);box-shadow:17px 22px 0 #0a1029,inset 0 0 0 5px #8c542f,inset 0 0 50px rgba(92,49,32,.28);transform:rotate(-2deg);overflow:hidden}
    .map:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 38% 42%,transparent 0 46px,rgba(76,65,71,.09) 47px 49px),linear-gradient(25deg,transparent 48%,rgba(115,70,45,.12) 49% 51%,transparent 52%)}
    .land{position:absolute;background:#6f9e65;border:5px solid var(--ink);box-shadow:inset 0 -12px rgba(48,89,70,.26)}.l1{left:-3%;top:27%;width:37%;height:50%;border-radius:35% 65% 45% 55%;transform:rotate(11deg)}.l2{right:-6%;top:18%;width:38%;height:55%;border-radius:60% 40% 67% 33%;transform:rotate(-18deg)}.l3{left:40%;bottom:-15%;width:28%;height:38%;border-radius:50%;transform:rotate(12deg)}
    .route{position:absolute;z-index:4;left:19%;top:31%;width:61%;height:39%;border:7px dashed var(--orange);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(7deg)}
    .plane{position:absolute;z-index:6;left:49%;top:45%;width:220px;height:78px;border:5px solid var(--ink);border-radius:70% 40% 35% 60%;background:linear-gradient(#fff0b8 0 50%,#4fa6a0 51% 78%,#274d70 79%);box-shadow:9px 10px 0 rgba(22,31,57,.45);transform:rotate(-8deg)}.plane:before{content:"";position:absolute;left:67px;top:42px;width:110px;height:45px;border:5px solid var(--ink);background:#d66548;clip-path:polygon(0 0,100% 50%,22% 70%)}.plane:after{content:"";position:absolute;right:22px;top:-36px;width:48px;height:48px;border:5px solid var(--ink);background:#e0824d;clip-path:polygon(0 100%,55% 0,100% 100%)}
    .window{position:absolute;z-index:7;left:40px;top:17px;width:30px;height:19px;border:4px solid var(--ink);border-radius:55% 30%;background:#89d6d2;box-shadow:42px 0 0 -3px #89d6d2,80px 0 0 -3px #89d6d2,118px 0 0 -3px #89d6d2}.engine{position:absolute;z-index:7;left:105px;top:65px;width:58px;height:32px;border:5px solid var(--ink);border-radius:48%;background:#e7b35d}
    .node{position:absolute;z-index:7;display:grid;place-items:center;width:52px;height:52px;border:5px solid var(--ink);border-radius:50%;background:var(--gold);color:var(--ink);font:900 12px/1 system-ui;box-shadow:5px 6px 0 rgba(23,31,57,.45)}.n1{left:14%;top:52%}.n2{left:34%;top:28%;background:var(--cyan)}.n3{right:20%;top:30%;background:var(--orange)}.n4{right:10%;bottom:23%;background:#d65c58}
    .title{position:absolute;z-index:9;left:3.5%;top:5%;margin:0;transform:rotate(-3deg);text-transform:uppercase}.title small{display:block;margin-left:9px;color:var(--cyan);font:900 14px/1 system-ui;letter-spacing:.38em}.title strong{display:block;max-width:490px;color:var(--paper);font:900 clamp(51px,6.5vw,96px)/.72 Georgia,serif;letter-spacing:-.07em;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 #a84437,0 12px 0 #10172e}.title em{display:block;margin:18px 0 0 8px;color:#f4bd52;font:900 12px/1 system-ui;letter-spacing:.2em;font-style:normal}
    .crew{position:absolute;z-index:8;left:3.2%;top:29%;width:25%;height:31%;overflow:hidden;border:7px solid var(--ink);border-radius:35% 60% 45% 55%;background:#203b62;box-shadow:10px 12px 0 #8f4932;transform:rotate(2deg)}.crew img{width:100%;height:100%;object-fit:cover;object-position:86% 35%;filter:saturate(1.22) contrast(1.12)}.crew:after{content:"CAPITANA + GATA";position:absolute;inset:auto 12px 12px;padding:8px;background:var(--paper);border:3px solid var(--ink);color:var(--ink);font:900 10px/1 system-ui;letter-spacing:.15em;text-align:center}
    .menu{position:absolute;z-index:10;left:3.6%;bottom:4%;width:28%;display:grid;grid-template-columns:1fr 1fr;gap:10px;transform:rotate(-1deg)}.menu button{min-height:64px;padding:9px 13px;border:5px solid var(--ink);border-radius:18px 7px 17px 9px;background:#4f7c70;color:var(--paper);box-shadow:6px 7px 0 #090e22,inset 0 4px rgba(255,255,255,.12);cursor:pointer;text-transform:uppercase;font:900 14px/1.05 system-ui;letter-spacing:.08em;text-shadow:0 2px var(--ink);transition:transform 150ms var(--ease),filter 150ms ease}.menu .start{grid-column:1/-1;min-height:92px;background:var(--orange);font-size:25px;transform:rotate(1deg)}.menu button:nth-child(3){background:#4e6f9a}.menu button:nth-child(4){background:#80516c}.menu button:hover,.menu button:focus-visible{outline:none;filter:brightness(1.17);transform:translateY(-3px) rotate(1deg)}.menu button:active{transform:translateY(5px) scale(.98);box-shadow:1px 2px 0 #090e22}
    .mission{position:absolute;z-index:11;right:2.8%;bottom:3%;width:32%;padding:13px 16px;border:6px solid var(--ink);border-radius:9px 26px 11px 22px;background:#213150;box-shadow:8px 9px 0 #090e22;transform:rotate(1deg)}.mission header{display:flex;justify-content:space-between;color:var(--gold);font:900 11px/1 system-ui;letter-spacing:.13em;text-transform:uppercase}.track{display:grid;grid-template-columns:1fr 1.3fr 1.6fr .7fr;gap:5px;margin-top:12px}.track i{height:31px;border:3px solid var(--ink);border-radius:8px 3px;background:var(--green)}.track i:nth-child(2){background:var(--gold)}.track i:nth-child(3){background:var(--orange)}.track i:nth-child(4){background:var(--cyan)}.mission p{margin:9px 0 0;color:#dbe4d5;font:700 11px/1.35 system-ui}.label{position:absolute;z-index:12;right:4%;top:5%;padding:10px 14px;border:4px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font:900 10px/1 system-ui;transform:rotate(5deg)}
    @media(max-width:760px){.book{min-height:0}.title{top:3%;left:4%}.title strong{font-size:54px}.title em{display:none}.map{left:7%;top:17%;width:89%;height:45%}.crew{left:5%;top:22%;width:37%;height:26%}.menu{left:5%;bottom:3%;width:90%;grid-template-columns:1fr 1fr}.menu .start{min-height:68px;font-size:20px}.menu button{min-height:50px;font-size:12px}.mission,.label{display:none}.plane{transform:scale(.68) rotate(-8deg);transform-origin:center}}
  </style>
</head>
<body>
  <main class="book">
    <div class="stars"></div>
    <h1 class="title"><small>Escuela de</small><strong>Aviación</strong><em>Bitácora de una misión imposible de olvidar</em></h1>
    <section class="map" aria-label="Mapa de misión"><div class="land l1"></div><div class="land l2"></div><div class="land l3"></div><div class="route"></div><i class="node n1">01</i><i class="node n2">02</i><i class="node n3">03</i><i class="node n4">★</i><div class="plane"><i class="window"></i><i class="engine"></i></div></section>
    <figure class="crew"><img src="../assets/images/menu-hangar-game-art.png" alt="Tripulación del vuelo"></figure>
    <nav class="menu"><button class="start">Comenzar vuelo</button><button>Cómo jugar</button><button>Ajustes</button><button>Créditos</button></nav>
    <aside class="mission"><header><span>Dificultad de misión</span><span>Ruta 01</span></header><div class="track"><i></i><i></i><i></i><i></i></div><p>Fácil para aprender · más patrones y velocidad en gran altura · pista despejada al final.</p></aside>
    <div class="label">Dirección C<br>Bitácora de aventura</div>
  </main>
</body>
</html>
