<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dirección A · Señalética remachada</title>
  <!-- Supuesto: el hangar funciona como una máquina recreativa física. La forma nace de placas, remaches, pintura de seguridad e instrumentos aeronáuticos. -->
  <style>
    :root{--ink:#101b2b;--cream:#fff0b0;--yellow:#ffc638;--coral:#f06449;--teal:#29c6b2;--blue:#24559b;--night:#081a37;--edge:#07101f;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050c18;color:var(--cream);font-family:Arial Black,Impact,system-ui,sans-serif}
    button{font:inherit}.stage{position:relative;width:100vw;height:100vh;min-height:650px;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 72% 24%,#2858a0 0 8%,transparent 30%),linear-gradient(#081735 0 58%,#183d4d 58% 66%,#49382b 66%)}
    .stage:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(115deg,transparent 0 50%,rgba(255,180,57,.13) 50.2% 51%,transparent 51.2%),radial-gradient(circle at 85% 13%,#fff4ba 0 3.8%,#d7b04b 4%,transparent 4.4%);opacity:.95}
    .stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 45%,rgba(1,5,13,.58));mix-blend-mode:screen}
    .roof{position:absolute;inset:0 0 auto;height:86px;background:#142334;border-bottom:8px solid #08111c;box-shadow:0 9px 0 #c27c24,0 15px 0 #101a26;clip-path:polygon(0 0,100% 0,100% 82%,91% 100%,8% 92%,0 100%)}
    .logo{position:absolute;z-index:4;top:27px;left:34px;transform:rotate(-2deg);text-transform:uppercase;text-shadow:0 5px 0 #10182c,0 9px 0 #a25427}
    .logo small{display:block;margin-left:8px;color:var(--teal);font:900 14px/1 system-ui;letter-spacing:.35em}.logo strong{display:block;font-size:clamp(40px,5.3vw,78px);line-height:.84;color:var(--yellow);-webkit-text-stroke:4px var(--edge);paint-order:stroke fill}.logo em{color:var(--cream);font-style:normal}
    .menu{position:absolute;z-index:5;left:4.2%;top:24%;width:34%;display:grid;gap:18px;transform:rotate(-1deg)}
    .sign{position:relative;min-height:72px;padding:12px 58px;border:5px solid var(--edge);clip-path:polygon(18px 0,calc(100% - 30px) 0,100% 24px,calc(100% - 12px) 100%,20px calc(100% - 4px),0 50%);color:var(--cream);background:#28535d;box-shadow:9px 11px 0 rgba(4,10,20,.75),inset 0 -8px 0 rgba(0,0,0,.2),inset 0 5px rgba(255,255,255,.14);cursor:pointer;text-transform:uppercase;letter-spacing:.08em;text-align:left;transition:transform 150ms var(--ease),filter 150ms ease}
    .sign:before,.sign:after{content:"";position:absolute;top:50%;width:13px;height:13px;margin-top:-7px;border:3px solid #4b2d16;border-radius:50%;background:#e0a047;box-shadow:inset 2px 2px #ffe27d}.sign:before{left:22px}.sign:after{right:25px}
    .sign b{font-size:clamp(19px,2vw,31px);text-shadow:0 3px 0 #08101c}.sign span{display:block;color:#b9e8de;font:800 10px/1.3 system-ui;letter-spacing:.24em}
    .sign.primary{min-height:112px;background:linear-gradient(160deg,#f38a3d,#d44b3c);transform:translateX(18px) rotate(1.5deg)}.sign.primary b{font-size:clamp(30px,3.2vw,49px)}
    .sign:nth-child(3){transform:translateX(27px) rotate(-1.5deg)}.sign:nth-child(4){transform:translateX(8px) rotate(1deg)}
    .sign:hover,.sign:focus-visible{outline:none;filter:brightness(1.16) saturate(1.15);transform:translate(4px,3px) rotate(0)}.sign:active{transform:translate(8px,8px) scale(.985);box-shadow:2px 3px 0 rgba(4,10,20,.75)}
    .hero{position:absolute;right:4.3%;top:15%;width:53%;height:62%;border:7px solid var(--edge);border-radius:48% 16% 20% 14%/18% 20% 18% 24%;overflow:hidden;background:#18375c;box-shadow:14px 18px 0 rgba(4,10,20,.7),inset 0 0 0 6px #d3842f;transform:rotate(1.2deg)}
    .hero img{width:100%;height:100%;object-fit:cover;object-position:73% center;filter:saturate(1.32) contrast(1.14)}.hero:after{content:"TRIPULACIÓN 07";position:absolute;right:22px;bottom:17px;padding:7px 14px;border:3px solid var(--edge);background:var(--yellow);color:var(--ink);font:900 12px/1 system-ui;letter-spacing:.15em;transform:rotate(-2deg)}
    .hud-demo{position:absolute;z-index:4;right:3%;bottom:4%;width:57%;height:18%;display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:12px;padding:12px;border:5px solid var(--edge);background:#18313a;box-shadow:8px 8px 0 #050a12;transform:rotate(-.5deg)}
    .gauge{position:relative;padding:12px 15px;border:3px solid #07121f;background:#234b54;box-shadow:inset 0 5px rgba(255,255,255,.08),inset 0 -7px rgba(0,0,0,.25)}.gauge label{display:block;color:#9ce6d8;font:900 11px/1 system-ui;letter-spacing:.18em}.gauge strong{display:block;margin-top:8px;font-size:28px}.hearts{color:#ff7559;letter-spacing:.12em}.bar{height:20px;margin-top:13px;border:3px solid #09131f;background:#0b1825}.bar i{display:block;width:67%;height:100%;background:repeating-linear-gradient(135deg,var(--yellow) 0 14px,#e59c22 14px 28px)}
    .danger{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}.danger i{height:22px;border:2px solid #08111c;background:#5ba776}.danger i:nth-child(3){background:#e5b53a}.danger i:nth-child(4),.danger i:nth-child(5){background:#e45d48}.legend{position:absolute;right:4%;bottom:23.5%;padding:8px 12px;border:3px solid var(--edge);background:var(--cream);color:var(--ink);font:900 10px/1 system-ui;letter-spacing:.12em;transform:rotate(1deg)}
    @media(max-width:760px){.stage{min-height:0}.logo{left:18px}.logo strong{font-size:43px}.menu{left:14px;right:14px;top:auto;bottom:16px;width:auto;gap:7px}.sign,.sign.primary,.sign:nth-child(n){min-height:54px;padding:8px 42px;transform:none}.sign.primary{min-height:68px}.sign b,.sign.primary b{font-size:20px}.hero{left:14%;right:auto;top:16%;width:82%;height:39%}.hud-demo{display:none}.legend{bottom:35%;font-size:8px}}
  </style>
</head>
<body>
  <main class="stage">
    <div class="roof"></div>
    <h1 class="logo"><small>Escuela de</small><strong>Avi<em>ación</em></strong></h1>
    <nav class="menu" aria-label="Menú conceptual">
      <button class="sign primary"><b>Comenzar vuelo</b><span>Pista lista · Misión 01</span></button>
      <button class="sign"><b>Cómo jugar</b><span>Manual de cabina</span></button>
      <button class="sign"><b>Ajustes</b><span>Instrumentos</span></button>
      <button class="sign"><b>Créditos</b><span>Bitácora</span></button>
    </nav>
    <figure class="hero"><img src="../assets/images/menu-hangar-game-art.png" alt="Piloto, gata y avión en el hangar"></figure>
    <div class="legend">Dirección A · Señalética remachada</div>
    <section class="hud-demo" aria-label="Muestra de HUD y dificultad">
      <div class="gauge"><label>VIDAS</label><strong class="hearts">♥ ♥ ♥</strong></div>
      <div class="gauge"><label>COMBUSTIBLE</label><strong>67%</strong><div class="bar"><i></i></div></div>
      <div class="gauge"><label>PELIGRO DE RUTA</label><strong>EN ASCENSO</strong><div class="danger"><i></i><i></i><i></i><i></i><i></i></div></div>
    </section>
  </main>
</body>
</html>
